<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="履约流水线：渠道拉单、审单、采购、中转仓扫码、打包核对、面单、出库、跨境轨迹、账单对账">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect width="1200" height="560" rx="18" fill="#f8fafc"/>
    <rect x="1" y="1" width="1198" height="558" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="52" font-size="27" font-weight="700" fill="#0f172a">端到端履约流水线</text>
    <text x="40" y="80" font-size="15" fill="#64748b">从平台订单到跨境签收，再到账单与利润核算；每一步在多租户上下文中留痕</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#e2e8f0" stroke-width="2"/>

    <rect x="40" y="130" width="340" height="30" rx="15" fill="#e0e7ff"/>
    <text x="56" y="150" font-size="13" font-weight="700" fill="#3730a3">业务运营 · 订单与商品</text>
    <rect x="400" y="130" width="470" height="30" rx="15" fill="#dcfce7"/>
    <text x="416" y="150" font-size="13" font-weight="700" fill="#166534">物流履约 · 中转仓与跨境</text>
    <rect x="890" y="130" width="270" height="30" rx="15" fill="#fef3c7"/>
    <text x="906" y="150" font-size="13" font-weight="700" fill="#92400e">财务中心 · 对账与利润</text>

    <g font-size="14" font-weight="700" text-anchor="middle">
      <rect x="40" y="190" width="150" height="105" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
      <text x="115" y="225" fill="#312e81">渠道拉单</text>
      <text x="115" y="252" font-size="12" font-weight="400" fill="#475569">Shopify / Amazon</text>
      <text x="115" y="272" font-size="12" font-weight="400" fill="#475569">淘宝 / 抖音 / Mock</text>

      <rect x="215" y="190" width="150" height="105" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
      <text x="290" y="225" fill="#312e81">审单与状态机</text>
      <text x="290" y="252" font-size="12" font-weight="400" fill="#475569">待审 / 通过 / 驳回</text>
      <text x="290" y="272" font-size="12" font-weight="400" fill="#475569">撤单 / 拦截 / 退货</text>

      <rect x="390" y="190" width="150" height="105" rx="13" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
      <text x="465" y="225" fill="#065f46">采购与收货标签</text>
      <text x="465" y="252" font-size="12" font-weight="400" fill="#475569">SKU 条码 / 扫码入库</text>
      <text x="465" y="272" font-size="12" font-weight="400" fill="#475569">Code128 收货标签</text>

      <rect x="565" y="190" width="150" height="105" rx="13" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
      <text x="640" y="225" fill="#065f46">中转仓打包核对</text>
      <text x="640" y="252" font-size="12" font-weight="400" fill="#475569">区-架-层库位</text>
      <text x="640" y="272" font-size="12" font-weight="400" fill="#475569">扫码枪 HID 输入</text>

      <rect x="740" y="190" width="150" height="105" rx="13" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
      <text x="815" y="225" fill="#065f46">面单与出库</text>
      <text x="815" y="252" font-size="12" font-weight="400" fill="#475569">PDF / ZPL 面单</text>
      <text x="815" y="272" font-size="12" font-weight="400" fill="#475569">轨迹回传平台</text>

      <rect x="915" y="190" width="150" height="105" rx="13" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
      <text x="990" y="225" fill="#92400e">承运商与对账</text>
      <text x="990" y="252" font-size="12" font-weight="400" fill="#475569">云途 / DHL / 4PX</text>
      <text x="990" y="272" font-size="12" font-weight="400" fill="#475569">燕文 / 账单双口径</text>
    </g>

    <g stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar2)">
      <line x1="192" y1="242" x2="211" y2="242"/>
      <line x1="367" y1="242" x2="386" y2="242"/>
      <line x1="542" y1="242" x2="561" y2="242"/>
      <line x1="717" y1="242" x2="736" y2="242"/>
      <line x1="892" y1="242" x2="911" y2="242"/>
    </g>

    <line x1="40" y1="330" x2="1160" y2="330" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="362" font-size="17" font-weight="700" fill="#0f172a">贯穿全链路的三条约束</text>

    <rect x="40" y="382" width="350" height="120" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="60" y="412" font-size="15" font-weight="700" fill="#1e293b">🔐 多租户隔离</text>
    <text x="60" y="440" font-size="13" fill="#475569">业务表全带 tenantId，JWT 派生租户</text>
    <text x="60" y="463" font-size="13" fill="#475569">Service 层自动过滤，杜绝越权</text>

    <rect x="415" y="382" width="350" height="120" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="435" y="412" font-size="15" font-weight="700" fill="#1e293b">🧾 可追溯留痕</text>
    <text x="435" y="440" font-size="13" fill="#475569">订单事件时间线 / 轨迹节点</text>
    <text x="435" y="463" font-size="13" fill="#475569">汇率快照 / 比价引擎痕迹</text>

    <rect x="790" y="382" width="370" height="120" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="810" y="412" font-size="15" font-weight="700" fill="#1e293b">⚙️ 演示 / 正式双路</text>
    <text x="810" y="440" font-size="13" fill="#475569">VITE_USE_MOCK=true 纯前端可交互</text>
    <text x="810" y="463" font-size="13" fill="#475569">false 走真实 API，生产构建强制关闭</text>

    <text x="40" y="535" font-size="14" fill="#64748b">注：真实平台 API 端点与字段仍为占位（TODO 联调），本图描述的是已实现的业务状态流，不代表已接通外部承运商。</text>
  </g>
</svg>
