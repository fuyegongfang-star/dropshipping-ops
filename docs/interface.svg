<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="界面功能地图：五组侧栏菜单与主要业务页面">
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect width="1200" height="620" rx="18" fill="#f8fafc"/>
    <rect x="1" y="1" width="1198" height="618" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <text x="40" y="52" font-size="27" font-weight="700" fill="#0f172a">界面与功能地图</text>
    <text x="40" y="80" font-size="15" fill="#64748b">深色渐变侧栏 + 浅灰主内容区，五组菜单按业务域归位；所有页面均支持演示 / 正式双路</text>
    <line x1="40" y1="102" x2="1160" y2="102" stroke="#e2e8f0" stroke-width="2"/>

    <rect x="40" y="130" width="250" height="440" rx="14" fill="#1e293b"/>
    <rect x="60" y="152" width="150" height="26" rx="8" fill="#4f6ef7"/>
    <text x="72" y="170" font-size="13" font-weight="700" fill="#ffffff">dropshipping-ops</text>

    <g font-size="13" fill="#cbd5e1">
      <text x="62" y="212" font-size="11" font-weight="700" fill="#64748b">概览</text>
      <text x="62" y="238">▦  仪表盘 / 开发进度</text>
      <text x="62" y="278" font-size="11" font-weight="700" fill="#64748b">业务运营</text>
      <text x="62" y="304">▤  订单中心 / 商品 SKU</text>
      <text x="62" y="330">▤  渠道店铺 / 采购单</text>
      <text x="62" y="370" font-size="11" font-weight="700" fill="#64748b">物流履约</text>
      <text x="62" y="396">◫  中转仓 / 承运商</text>
      <text x="62" y="422">◫  面单 / 轨迹 / 运费试算</text>
      <text x="62" y="462" font-size="11" font-weight="700" fill="#64748b">财务中心</text>
      <text x="62" y="488">◈  账单 / 对账 / 利润</text>
      <text x="62" y="528" font-size="11" font-weight="700" fill="#64748b">系统设置</text>
      <text x="62" y="552">⚙  运营配置 / 站点设置</text>
    </g>

    <text x="320" y="152" font-size="15" font-weight="700" fill="#0f172a">主要页面</text>

    <g font-size="14">
      <rect x="320" y="170" width="260" height="105" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
      <text x="340" y="202" font-weight="700" fill="#312e81">仪表盘 · /</text>
      <text x="340" y="228" font-size="12" fill="#475569">核心指标 / 订单状态分布</text>
      <text x="340" y="250" font-size="12" fill="#475569">最近交付能力 / 本次更新红点</text>

      <rect x="600" y="170" width="260" height="105" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
      <text x="620" y="202" font-weight="700" fill="#312e81">订单中心 · /orders</text>
      <text x="620" y="228" font-size="12" fill="#475569">审单 / 状态转移 / 逆向</text>
      <text x="620" y="250" font-size="12" fill="#475569">明细抽屉 + 事件时间线</text>

      <rect x="880" y="170" width="280" height="105" rx="13" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
      <text x="900" y="202" font-weight="700" fill="#312e81">商品 SKU · /catalog</text>
      <text x="900" y="228" font-size="12" fill="#475569">平台 ↔ 内部 ↔ 供应商映射</text>
      <text x="900" y="250" font-size="12" fill="#475569">扫码录入 / 计费重 / 批量建档</text>

      <rect x="320" y="295" width="260" height="105" rx="13" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
      <text x="340" y="327" font-weight="700" fill="#065f46">中转仓 · /transfer</text>
      <text x="340" y="353" font-size="12" fill="#475569">扫码入库 / 区-架-层库位</text>
      <text x="340" y="375" font-size="12" fill="#475569">打包核对 / 出库回传</text>

      <rect x="600" y="295" width="260" height="105" rx="13" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
      <text x="620" y="327" font-weight="700" fill="#065f46">采购单 · /purchase-orders</text>
      <text x="620" y="353" font-size="12" fill="#475569">关联订单 / 状态机推进</text>
      <text x="620" y="375" font-size="12" fill="#475569">Code128 收货标签打印</text>

      <rect x="880" y="295" width="280" height="105" rx="13" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
      <text x="900" y="327" font-weight="700" fill="#065f46">承运商 · /carriers</text>
      <text x="900" y="353" font-size="12" fill="#475569">云途 / DHL / 4PX / 燕文</text>
      <text x="900" y="375" font-size="12" fill="#475569">六能力矩阵 + 健康状态</text>

      <rect x="320" y="420" width="260" height="105" rx="13" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
      <text x="340" y="452" font-weight="700" fill="#92400e">运费试算 · /quotes</text>
      <text x="340" y="478" font-size="12" fill="#475569">四层比价引擎痕迹</text>
      <text x="340" y="500" font-size="12" fill="#475569">成本 / 售价双价列</text>

      <rect x="600" y="420" width="260" height="105" rx="13" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
      <text x="620" y="452" font-weight="700" fill="#075985">站点设置 · /settings/site</text>
      <text x="620" y="478" font-size="12" fill="#475569">品牌 / TDK / 统计代码</text>
      <text x="620" y="500" font-size="12" fill="#475569">预览联动侧栏与标签页</text>

      <rect x="880" y="420" width="280" height="105" rx="13" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
      <text x="900" y="452" font-weight="700" fill="#075985">开发进度 · /progress</text>
      <text x="900" y="478" font-size="12" fill="#475569">任务清单 / 完成度 / NEW 高亮</text>
      <text x="900" y="500" font-size="12" fill="#475569">由 progress:gen 静态生成</text>
    </g>

    <text x="40" y="592" font-size="14" fill="#64748b">角色隔离：super（平台运营方）可见站点设置 / 开发进度 / 租户管理；seller（卖家租户）登录后只见业务功能。</text>
  </g>
</svg>
